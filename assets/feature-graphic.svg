<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- candlestick chart art -->
  <g opacity="0.9">
    <rect x="640" y="300" width="26" height="90" rx="4" fill="#22c55e"/>
    <rect x="650" y="275" width="6" height="140" fill="#22c55e"/>
    <rect x="690" y="270" width="26" height="70" rx="4" fill="#ef4444"/>
    <rect x="700" y="250" width="6" height="110" fill="#ef4444"/>
    <rect x="740" y="235" width="26" height="85" rx="4" fill="#22c55e"/>
    <rect x="750" y="210" width="6" height="135" fill="#22c55e"/>
    <rect x="790" y="205" width="26" height="65" rx="4" fill="#22c55e"/>
    <rect x="800" y="185" width="6" height="105" fill="#22c55e"/>
    <rect x="840" y="180" width="26" height="60" rx="4" fill="#ef4444"/>
    <rect x="850" y="160" width="6" height="100" fill="#ef4444"/>
    <rect x="890" y="140" width="26" height="80" rx="4" fill="#22c55e"/>
    <rect x="900" y="115" width="6" height="130" fill="#22c55e"/>
  </g>

  <!-- rising trend arrow -->
  <path d="M 120 400 L 320 300 L 420 340 L 620 200 L 760 240" fill="none" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M 760 240 L 705 232 M 760 240 L 752 185" fill="none" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" opacity="0.95"/>

  <!-- wordmark -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" letter-spacing="-2">TradeCub</text>
  <text x="84" y="240" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#86efac">Learn to trade. Level by level.</text>
  <text x="84" y="460" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8">Gamified lessons · Real market simulator · Streaks &amp; quests</text>
</svg>
