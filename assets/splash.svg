<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="2732" height="2732" fill="url(#bg)"/>
  <g transform="translate(1024,1110)">
    <!-- candlesticks -->
    <rect x="-170" y="-160" width="24" height="150" rx="12" fill="#4ade80" opacity="0.55"/>
    <rect x="-184" y="-100" width="52" height="140" rx="15" fill="url(#candle)"/>
    <rect x="-60" y="-190" width="24" height="180" rx="12" fill="#4ade80" opacity="0.55"/>
    <rect x="-74" y="-130" width="52" height="200" rx="15" fill="url(#candle)"/>
    <rect x="50" y="-120" width="24" height="150" rx="12" fill="#f87171" opacity="0.6"/>
    <rect x="36" y="-70" width="52" height="150" rx="15" fill="#ef4444"/>
    <rect x="160" y="-230" width="24" height="190" rx="12" fill="#4ade80" opacity="0.55"/>
    <rect x="146" y="-170" width="52" height="240" rx="15" fill="url(#candle)"/>
    <!-- trend arrow -->
    <path d="M-200 130 L-40 55 L80 90 L270 -70" stroke="#fbbf24" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M210 -70 h60 v60" stroke="#fbbf24" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-14)"/>
  </g>
  <text x="1366" y="1560" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="110" font-weight="700" fill="#f8fafc">Trade<tspan fill="#4ade80">Quest</tspan></text>
</svg>
